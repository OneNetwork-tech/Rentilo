# Local production-like stack: Rentilo + PostgreSQL.
#   docker compose up --build      then open http://localhost:8080
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rentilo
      POSTGRES_USER: rentilo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rentilo-dev-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentilo -d rentilo"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=rentilo;Username=rentilo;Password=${POSTGRES_PASSWORD:-rentilo-dev-password};Gss Encryption Mode=Disable"
      Database__MigrateOnStartup: "true"
      Database__SeedDemoData: "${SEED_DEMO_DATA:-true}"
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/wwwroot/uploads
      - keys:/app/keys

volumes:
  pgdata:
  uploads:
  keys:
